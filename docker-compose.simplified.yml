# Version simplifiée avec montage des dossiers complets

version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-dev
    environment:
      POSTGRES_DB: advanced_web_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network-dev

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - internal-network

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile.dev
    container_name: auth-service-dev
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      USER_SERVICE_URL: http://user-service:3001
      NODE_ENV: development
    networks:
      - internal-network
    volumes:
      # Monter tout le dossier du microservice sauf node_modules
      - ./apps/auth-service:/usr/src/app/apps/auth-service
      - /usr/src/app/apps/auth-service/node_modules
      - ./packages:/usr/src/app/packages

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile.dev
    container_name: api-gateway-dev
    depends_on:
      - postgres
      - user-service
      - auth-service
      - product-service
      - delivery-service-dev
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_POSTGRES}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      DELIVERY_SERVICE_URL: http://delivery-service-dev:3003
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks:
      - internal-network
      - external-network
    restart: unless-stopped
    volumes:
      # Monter tout le dossier du microservice sauf node_modules
      - ./apps/api-gateway:/usr/src/app/apps/api-gateway
      - /usr/src/app/apps/api-gateway/node_modules
      - ./packages:/usr/src/app/packages

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile.dev
    container_name: user-service-dev
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL_POSTGRES}
      NODE_ENV: development
    networks:
      - internal-network
    volumes:
      # Monter tout le dossier du microservice sauf node_modules
      - ./apps/user-service:/usr/src/app/apps/user-service
      - /usr/src/app/apps/user-service/node_modules
      - ./packages:/usr/src/app/packages

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile.dev
    container_name: product-service-dev
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL_POSTGRES}
      NODE_ENV: development
    networks:
      - internal-network
    volumes:
      # Monter tout le dossier du microservice sauf node_modules
      - ./apps/product-service:/usr/src/app/apps/product-service
      - /usr/src/app/apps/product-service/node_modules
      - ./packages:/usr/src/app/packages

  delivery-service-dev:
    build:
      context: .
      dockerfile: apps/delivery-service/Dockerfile.dev
    container_name: delivery-service-dev
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-dev:5432/advanced_web_project?schema=public
      - NODE_ENV=development
    ports:
      - "3003:3003"
      - "4003:4003"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/delivery-service/node_modules
    depends_on:
      - postgres
    networks:
      - app-network-dev
    tty: true
    stdin_open: true
    command: sh -c "chmod +x /usr/src/app/apps/delivery-service/dev-start.sh && /usr/src/app/apps/delivery-service/dev-start.sh"

  log-service:
    build:
      context: .
      dockerfile: apps/log-service/Dockerfile.dev
    container_name: log-service-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
    networks:
      - internal-network
    volumes:
      # Monter tout le dossier du microservice sauf node_modules
      - ./apps/log-service:/usr/src/app/apps/log-service
      - /usr/src/app/apps/log-service/node_modules
      - ./packages:/usr/src/app/packages

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile.dev
    container_name: order-service-dev
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL_POSTGRES}
      NODE_ENV: development
    networks:
      - internal-network
    volumes:
      # Monter tout le dossier du microservice sauf node_modules
      - ./apps/order-service:/usr/src/app/apps/order-service
      - /usr/src/app/apps/order-service/node_modules
      - ./packages:/usr/src/app/packages

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: frontend-dev
    depends_on:
      - api-gateway
    ports:
      - "8080:3000"
    networks:
      - external-network
    restart: unless-stopped
    volumes:
      # Monter tout le dossier du frontend sauf node_modules
      - ./apps/frontend:/usr/src/app/apps/frontend
      - /usr/src/app/apps/frontend/node_modules
      - ./packages:/usr/src/app/packages
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000

volumes:
  postgres_data_dev:
  redis_data:

networks:
  internal-network:
    driver: bridge
    internal: true
  
  external-network:
    driver: bridge

  app-network-dev:
    driver: bridge