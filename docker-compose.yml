services:
  postgres:
    image: postgres:14
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${DATABASE_MDP_POSTGRES}
      POSTGRES_DB: ${DATABASE_NAME_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal-network
    deploy:
      resources:
        limits:
          memory: 512M
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - internal-network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}", "--appendonly", "yes"]
    deploy:
      resources:
        limits:
          memory: 128M
    cap_drop:
      - ALL

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      USER_SERVICE_URL: http://user-service:3001
    networks:
      - internal-network
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      - postgres
      - user-service
      - auth-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_POSTGRES}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3001
      NODE_ENV: production
    ports:
      - "3000:3000"
      - "80:80"
      - "443:443"
    networks:
      - internal-network
      - external-network
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - api_gateway_logs:/var/log/nginx
      - ssl_certs:/etc/nginx/ssl

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile.dev
    container_name: user-service
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL_POSTGRES}
    networks:
      - internal-network
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      - api-gateway
    ports:
      - "8080:80"
    networks:
      - external-network
    restart: unless-stopped
    cap_drop:
      - ALL

  log-service:
    build:
      context: .
      dockerfile: apps/log-service/Dockerfile
    container_name: log-service
    restart: unless-stopped
    volumes:
      - log_service_data:/app/logs
    networks:
      - internal-network
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  api_gateway_logs:
  log_service_data:
  ssl_certs:

networks:
  internal-network:
    driver: bridge
    internal: true
  
  external-network:
    driver: bridge
