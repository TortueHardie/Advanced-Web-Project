version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # API Gateway - Point d'entrée unique
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile.dev
    container_name: api-gateway
    env_file:
      - .env
    environment:
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - DELIVERY_SERVICE_URL=http://delivery-service:3003
      - ORDER_SERVICE_URL=http://order-service:3004
    ports:
      - "3000:3000"
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      delivery-service:
        condition: service_started
      order-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # Service Utilisateurs
  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile.dev
    container_name: user-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "3001:3001"
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Service Produits (Restaurants, Menus, Articles)
  product-service:
    build:
      context: ./apps/product-service
      dockerfile: Dockerfile.dev
    container_name: product-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - RABBITMQ_URL=${RABBITMQ_URL}
    ports:
      - "3002:3002"
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # Service Livraison
  delivery-service:
    build:
      context: ./apps/delivery-service
      dockerfile: Dockerfile.dev
    container_name: delivery-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - RABBITMQ_URL=${RABBITMQ_URL}
    ports:
      - "3003:3003"
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # Service Commandes
  order-service:
    build:
      context: ./apps/order-service
      dockerfile: Dockerfile.dev
    container_name: order-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - DELIVERY_SERVICE_URL=http://delivery-service:3003
    ports:
      - "3004:3004"
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      delivery-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
