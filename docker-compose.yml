version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: advanced_web_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # API Gateway - Point d'entrée unique
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - .env
    environment:
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - DELIVERY_SERVICE_URL=http://delivery-service:3003
      - ORDER_SERVICE_URL=http://order-service:3004
    ports:
      - "3000:3000"
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      delivery-service:
        condition: service_started
      order-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # Service Utilisateurs
  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: user-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/advanced_web_project?schema=public
    ports:
      - "3001:3001"
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Service Produits (Restaurants, Menus, Articles)
  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: product-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/advanced_web_project?schema=public
      - USER_SERVICE_URL=http://user-service:3001
    ports:
      - "3002:3002"
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # Service Livraison
  delivery-service:
    build:
      context: .
      dockerfile: apps/delivery-service/Dockerfile
    container_name: delivery-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/advanced_web_project?schema=public
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
    ports:
      - "3003:3003"
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # Service Commandes
  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: order-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/advanced_web_project?schema=public
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - DELIVERY_SERVICE_URL=http://delivery-service:3003
    ports:
      - "3004:3004"
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      delivery-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
