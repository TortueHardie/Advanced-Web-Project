worker_processes auto;
pid /run/nginx/nginx.pid;

# Niveau de log et fichiers de log
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Configuration du rate limiting
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    
    # Format de log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M; # Limiter la taille des requêtes
    
    # Configuration de protection contre les attaques
    server_tokens off; # Masquer la version de NGINX
    
    server {
        listen 80;
        
        # Paramètres généraux du serveur
        server_name localhost;
        
        # Configuration de sécurité générale
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Configuration CORS
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        # Traitement spécial pour les requêtes OPTIONS (pre-flight)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        # Page d'accueil par défaut
        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Protection du rate-limiting global 
        limit_req zone=api_limit burst=50 nodelay;
        
        # Route pour la documentation Swagger - connexion directe à l'application NestJS
        location /docs {
            # Redirection vers l'application NestJS locale
            proxy_pass http://localhost:3000/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Configuration pour le service d'authentification
        location /auth/ {
            # Redirection des requêtes vers le service auth
            proxy_pass http://auth-service:3001/;
            
            # Configuration du proxy    
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout plus court pour les requêtes d'authentification
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        # Routes spécifiques d'authentification avec rate limiting
        location /auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://auth-service:3001/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /auth/register {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://auth-service:3001/auth/register;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Configuration pour le service utilisateur
        location /user/ {
            # Vérification de l'authentification pour les routes protégées
            auth_request /auth-verify;
            
            # En cas d'échec d'authentification, redirection vers une page d'erreur 401
            error_page 401 = @error401;
            
            # Redirection des requêtes vers le service utilisateur
            proxy_pass http://user-service:3001/;
            
            # Configuration du proxy
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Transférer le token d'autorisation au service
            proxy_set_header Authorization $http_authorization;
        }

        # Configuration pour le service de produits
        location /product/ {
            # Vérification de l'authentification pour les routes protégées
            auth_request /auth-verify;
            
            # En cas d'échec d'authentification, redirection vers une page d'erreur 401
            error_page 401 = @error401;
            
            # Redirection des requêtes vers le service de produits
            proxy_pass http://product-service:3002/;
            
            # Configuration du proxy
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Transférer le token d'autorisation au service
            proxy_set_header Authorization $http_authorization;
        }
        
        # Endpoint interne pour vérifier l'authentification
        location = /auth-verify {
            # Cette requête est interne et n'est pas accessible depuis l'extérieur
            internal;
            
            # Envoi de la requête au service d'authentification
            proxy_pass http://auth-service:3001/auth/verify;
            
            # Transfert des headers, notamment Authorization
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            
            # Transmettre l'header Authorization à notre service d'authentification
            proxy_set_header Authorization $http_authorization;
            
            # Timeout court pour vérification d'authentification
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }
        
        # Gestion des erreurs d'authentification
        location @error401 {
            return 401 '{"error":"Authentification requise"}';
            add_header Content-Type application/json;
        }
        
        # Bloquer l'accès aux fichiers cachés
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Configuration de base pour les erreurs
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
} 