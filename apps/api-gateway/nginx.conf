worker_processes auto;
pid /run/nginx/nginx.pid;

# Niveau de log et fichiers de log
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Format de log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    keepalive_timeout 65;
    
    server {
        listen 80;
        
        # Paramètres généraux du serveur
        server_name localhost;
        
        # Page d'accueil par défaut
        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }
        
        # Route pour la documentation Swagger - connexion directe à l'application NestJS
        location /docs {
            # Redirection vers l'application NestJS locale
            proxy_pass http://localhost:3000/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Configuration pour le service d'authentification
        location /auth/ {
            # Redirection des requêtes vers le service auth
            proxy_pass http://auth-service:3001/;
            
            # Configuration du proxy    
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Configuration pour le service utilisateur
        location /user/ {
            # Vérification de l'authentification pour les routes protégées
            auth_request /auth-verify;
            
            # En cas d'échec d'authentification, redirection vers une page d'erreur 401
            error_page 401 = @error401;
            
            # Redirection des requêtes vers le service utilisateur
            proxy_pass http://user-service:3001/;
            
            # Configuration du proxy
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Transférer le token d'autorisation au service
            proxy_set_header Authorization $http_authorization;
        }
        
        # Endpoint interne pour vérifier l'authentification
        location = /auth-verify {
            # Cette requête est interne et n'est pas accessible depuis l'extérieur
            internal;
            
            # Envoi de la requête au service d'authentification
            proxy_pass http://auth-service:3001/auth/verify;
            
            # Transfert des headers, notamment Authorization
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            
            # Transmettre l'header Authorization à notre service d'authentification
            proxy_set_header Authorization $http_authorization;
        }
        
        # Endpoint interne pour l'écriture des logs
        location = /log-write {
            internal;
            proxy_pass http://log-service:3002/api/v1/logs;
            proxy_set_header Content-Type application/json;
            proxy_pass_request_body on;
        }
        
        # Gestion des erreurs d'authentification
        location @error401 {
            return 401 '{"error":"Authentification requise"}';
            add_header Content-Type application/json;
        }
        
        # Configuration de base pour les erreurs
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
} 