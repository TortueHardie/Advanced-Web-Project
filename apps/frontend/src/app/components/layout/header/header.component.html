<mat-toolbar color="primary">
    <div class="left-section">
      <button mat-icon-button (click)="menuClick.emit()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="logo">Pop-Eat</span>
    </div>
    
    <!-- Desktop Search -->
    <div class="search-container desktop-only">
      <mat-form-field appearance="outline" class="address-field">
        <mat-icon matPrefix>location_on</mat-icon>
        <input 
          matInput 
          placeholder="Ville" 
          [(ngModel)]="cityTerm"
          (ngModelChange)="onCityChange($event)"
        />
      </mat-form-field>
      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input 
          matInput 
          placeholder="Rechercher dans Pop-Eat" 
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange($event)"
        />
      </mat-form-field>
    </div>

    <!-- Desktop Actions -->
    <div class="right-section desktop-only">
      <button mat-icon-button (click)="cartClick.emit()">
        <mat-icon>shopping_cart</mat-icon>
        <span class="cart-badge" *ngIf="hasCartItems">{{totalCartItems}}</span>
      </button>
      <button mat-icon-button [matMenuTriggerFor]="notificationMenu">
        <mat-icon>notifications</mat-icon>
        <span class="notification-badge" *ngIf="hasNotifications">{{notifications.length}}</span>
      </button>
    </div>

    <!-- Mobile Actions -->
    <div class="right-section mobile-only">
      <button mat-icon-button [matMenuTriggerFor]="mobileMenu">
        <mat-icon>search</mat-icon>
      </button>
      <button mat-icon-button (click)="cartClick.emit()">
        <mat-icon>shopping_cart</mat-icon>
        <span class="cart-badge" *ngIf="hasCartItems">{{totalCartItems}}</span>
      </button>
      <button mat-icon-button [matMenuTriggerFor]="notificationMenu">
        <mat-icon>notifications</mat-icon>
        <span class="notification-badge" *ngIf="hasNotifications">{{notifications.length}}</span>
      </button>
    </div>
  </mat-toolbar>

  <!-- Mobile Menu -->
  <mat-menu #mobileMenu="matMenu" class="mobile-menu">
    <div class="mobile-search-container">
      <mat-form-field appearance="outline" class="mobile-address-field">
        <mat-icon matPrefix>location_on</mat-icon>
        <input 
          matInput 
          placeholder="Ville" 
          [(ngModel)]="cityTerm"
          (ngModelChange)="onCityChange($event)"
        />
      </mat-form-field>
      <mat-form-field appearance="outline" class="mobile-search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input 
          matInput 
          placeholder="Rechercher" 
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange($event)"
        />
      </mat-form-field>
    </div>
  </mat-menu>

  <!-- Notification Menu -->
  <mat-menu #notificationMenu="matMenu" class="notification-menu">
    <div class="notification-header">
      <h3>Notifications ({{notifications.length}})</h3>
    </div>
    <div class="notification-list">
      <div class="notification-item" *ngFor="let notification of notifications">
        <mat-icon class="notification-icon">{{notification.icon}}</mat-icon>
        <div class="notification-content">
          <p class="notification-title">{{notification.title}}</p>
          <p class="notification-message">{{notification.message}}</p>
          <span class="notification-time">{{notification.time}}</span>
        </div>
      </div>
      <div class="no-notifications" *ngIf="notifications.length === 0">
        <p>Aucune notification</p>
      </div>
    </div>
  </mat-menu>
