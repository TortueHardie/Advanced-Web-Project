<div class="item-update-container">
  <h2>Edition article</h2>
  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
    <mat-card>
      <mat-card-content>
        <div class="form-field">
          <mat-form-field appearance="outline">
            <mat-label>Nom</mat-label>
            <input matInput formControlName="name" placeholder="ex : Classic Burger">
          </mat-form-field>
        </div>

        <div class="form-field">
          <label>Photo</label>
          <div class="photo-upload">
            <input type="file" (change)="onFileSelected($event)" accept="image/*" #fileInput>
            <button mat-stroked-button type="button" (click)="fileInput.click()">
              PARCOURIR LES FICHIERS
            </button>
            <div class="preview" *ngIf="selectedImage">
              <img [src]="selectedImage" alt="Preview">
            </div>
          </div>
        </div>

        <div class="form-field">
          <mat-form-field appearance="outline">
            <mat-label>Description (optionnelle)</mat-label>
            <textarea matInput formControlName="description" placeholder="ex : Pain, salade, tomate, oignon..."></textarea>
          </mat-form-field>
        </div>

        <div class="form-field">
          <mat-form-field appearance="outline">
            <mat-label>Prix</mat-label>
            <input matInput type="number" formControlName="price" placeholder="ex : 8.00 €">
            <span matSuffix>€</span>
          </mat-form-field>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button type="button" (click)="onCancel()">ANNULER</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="!itemForm.valid">SAUVEGARDER</button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>
